<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — CARTERA</title>
  <meta name="description" content="Cartera Portfolio Administration Login">
  <meta name="theme-color" content="#141519">

  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/android-chrome-512x512.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Google Fonts: Archivo Black & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* Dedicated Admin Login Styles */
    .login-viewport {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      background: 
        radial-gradient(
          ellipse 80% 60% at 50% 20%,
          rgba(92, 96, 108, 0.45) 0%,
          rgba(65, 68, 77, 0.28) 32%,
          rgba(38, 40, 46, 0.14) 60%,
          rgba(19, 20, 24, 0) 85%
        ),
        linear-gradient(
          180deg,
          #26282f 0%,
          #1e2025 30%,
          #15161a 70%,
          #141519 100%
        );
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(23, 24, 30, 0.85);
      border: 1px solid rgba(237, 237, 240, 0.12);
      border-radius: 14px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(237, 237, 240, 0.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position: relative;
      z-index: 10;
    }

    .login-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .login-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 1.85rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 0.85rem 2.75rem 0.85rem 1rem;
      background: rgba(14, 15, 19, 0.75);
      border: 1px solid rgba(237, 237, 240, 0.14);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: all var(--transition-fast);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--text-primary);
      box-shadow: 0 0 0 3px rgba(237, 237, 240, 0.1);
      background: rgba(18, 19, 24, 0.9);
    }

    .toggle-password-btn {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0.25rem;
      transition: color var(--transition-fast);
    }

    .toggle-password-btn:hover {
      color: var(--text-primary);
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: -0.25rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-input {
      accent-color: var(--text-primary);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .login-btn {
      margin-top: 0.5rem;
      padding: 0.9rem 1.5rem;
      background: var(--text-primary);
      color: #121316;
      border: none;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .login-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-error {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.82rem;
      line-height: 1.4;
      text-align: center;
    }

    .login-error.show {
      display: block;
      animation: fadeIn 0.25s ease-out;
    }

    .back-home {
      margin-top: 2.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .back-home:hover {
      color: var(--text-primary);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-viewport">
    <div class="login-card">
      <div class="login-header">
        <span class="login-badge">// RESTRICTED ACCESS</span>
        <h1 class="login-title">CARTERA</h1>
        <p class="login-subtitle">Portfolio Administration Panel</p>
      </div>

      <div class="login-error" id="login-error" role="alert"></div>

      <form class="login-form" id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="admin-password" class="form-label">Admin Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="admin-password" 
              class="form-input" 
              placeholder="Enter password..."
              required
              autofocus
            >
            <button type="button" class="toggle-password-btn" id="toggle-password-btn" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" class="checkbox-input" checked>
            <span>Stay signed in</span>
          </label>
        </div>

        <button type="submit" class="login-btn" id="submit-btn">
          <span>SIGN IN</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>

    <a href="index.html" class="back-home">
      &larr; Return to Portfolio
    </a>
  </div>

  <!-- Supabase JS CDN (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Configuration and Auth Helpers -->
  <script src="supabase-config.js"></script>

  <script>
    // Redirect if already logged in
    redirectIfLoggedIn();

    const loginForm = document.getElementById('login-form');
    const passwordInput = document.getElementById('admin-password');
    const rememberCheckbox = document.getElementById('remember-me');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const errorDiv = document.getElementById('login-error');
    const submitBtn = document.getElementById('submit-btn');

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.style.color = isPassword ? 'var(--text-primary)' : 'var(--text-muted)';
    });

    // Handle Form Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.remove('show');
      errorDiv.textContent = '';
      
      const password = passwordInput.value.trim();
      const remember = rememberCheckbox.checked;

      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      try {
        const result = await loginAdmin(password, remember);
        if (result.success) {
          // Success -> redirect to admin dashboard
          window.location.href = 'admin.html';
        } else {
          errorDiv.textContent = result.error || 'Authentication failed.';
          errorDiv.classList.add('show');
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        errorDiv.textContent = 'An error occurred during authentication.';
        errorDiv.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
